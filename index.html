*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:var(--bg);font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif}
#stage,#list{text-shadow:0 0 14px rgba(232,240,243,.45)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

#stage{height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(8vh,env(safe-area-inset-top)) 9vw max(5vh,env(safe-area-inset-bottom))}
#hero{margin:auto 0;display:flex;align-items:center;gap:7vw}
#textcol{flex:1;min-width:0}
#sentence{font-size:clamp(18px,4.2vw,34px);line-height:1.95;font-weight:300;
  letter-spacing:.01em;white-space:pre-line;word-break:keep-all;max-width:22em;
  opacity:0;transition:opacity 1.6s ease}
#sentence.show{opacity:1}

#cdcol{flex:none;width:min(34vw,50vh);display:flex;flex-direction:column;align-items:center}
#cd{width:100%;aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle,transparent 0 6.5%,#8E9AA1 6.6% 7.6%,transparent 7.7%),
    radial-gradient(circle,transparent 0 21%,rgba(79,101,115,.32) 21.2% 31%,transparent 31.2%),
    repeating-radial-gradient(circle,rgba(255,255,255,.16) 0 1px,rgba(35,42,46,.05) 1px 3px),
    conic-gradient(#DCE1E4,#AAB5BB,#F1F3F4,#98A4AB,#E0E5E7,#B2BCC2,#F1F3F4,#A0ABB2,#DCE1E4);
  border:1px solid rgba(255,255,255,.6);
  -webkit-mask:radial-gradient(circle,transparent 0 6.6%,#000 6.7%);mask:radial-gradient(circle,transparent 0 6.6%,#000 6.7%);
  animation:spin 8s linear infinite;animation-play-state:paused}
#cd{position:relative}
#label{position:absolute;inset:18%;border-radius:50%;background:center/cover no-repeat;
  -webkit-mask:radial-gradient(circle,transparent 0 12%,#000 12.5%);
  mask:radial-gradient(circle,transparent 0 12%,#000 12.5%);
  opacity:0;transition:opacity 1.2s ease}
body.playing #cd{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@media (orientation:portrait){
  #hero{flex-direction:column;align-items:flex-start;gap:7vh}
  #cdcol{order:-1;width:min(50vw,34vh);align-self:center}
}
@media (prefers-reduced-motion:reduce){#cd{animation:none}}

#meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:clamp(13px,2.6vw,16px);
  padding-bottom:18px}
#songinfo,#work{opacity:0;transition:opacity 1.6s ease}
#songinfo.show,#work.show{opacity:1}
#songinfo{margin-top:24px;text-align:center}
#title{font-size:clamp(16px,3.4vw,22px);font-weight:400;letter-spacing:.02em}
#artist{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:clamp(12px,2.4vw,15px);color:var(--mute);margin-top:6px}
#work{margin-top:24px;color:var(--mute);font-size:clamp(12px,2.3vw,15px);letter-spacing:.05em}
#list-btn{color:var(--mute);padding:14px 4px 14px 18px;font-size:inherit;justify-self:end}
#ctrl{display:flex;align-items:center;gap:clamp(8px,4vw,22px)}
#ctrl button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:50%}
#ctrl svg{width:22px;height:22px;fill:currentColor}
#pp svg{width:26px;height:26px}
#pp .i-pause{display:none}
body.playing #pp .i-play{display:none}
body.playing #pp .i-pause{display:block}
#bar{height:1px;background:var(--line);position:relative}
#fill{position:absolute;left:0;top:0;height:1px;width:0;background:var(--ink)}

#list{position:fixed;inset:0;background:rgba(222,231,235,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:max(7vh,env(safe-area-inset-top)) 9vw 5vh;
  overflow-y:auto;display:none;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#list.open{display:block}
#list li{list-style:none}
#list button{width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line);
  display:flex;gap:18px;font-size:clamp(15px,3vw,18px)}
#list .n{color:var(--mute);width:2em;flex:none}
#list .cur{font-weight:600}
#listhead{position:sticky;top:0;display:flex;justify-content:space-between;background:rgba(222,231,235,.9);padding:4px 0 8px}
#list #listhead button{width:auto;display:block;border-bottom:0;color:var(--mute);padding:10px 0;font-size:clamp(14px,2.8vw,17px)}

#start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,6.4vw,44px);color:var(--ink);letter-spacing:.14em;font-weight:300;z-index:5;
  text-shadow:0 0 18px rgba(232,240,243,.5)}
#start span{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#sentence{transition:none}#start span{animation:none}}
</style>
</head>
<body>
<main id="stage">
  <div id="hero">
    <div id="textcol">
      <p id="sentence" aria-live="polite"></p>
      <div id="work"></div>
    </div>
    <div id="cdcol">
      <div id="cd" aria-hidden="true"><div id="label"></div></div>
      <div id="songinfo"><div id="title"></div><div id="artist"></div></div>
    </div>
  </div>
  <div>
    <div id="meta">
      <div></div>
      <div id="ctrl">
        <button id="prev" type="button" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="pp" type="button" aria-label="재생 또는 일시정지">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button id="next" type="button" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
      <button id="list-btn" type="button">목록</button>
    </div>
    <div id="bar"><div id="fill"></div></div>
  </div>
</main>

<ol id="list"></ol>
<button id="start" type="button"><span>「실시간의 당신」</span></button>

<script src="tracks.js"></script>
<script>


var $ = function(id){return document.getElementById(id)};
var audio = new Audio(); audio.preload = "auto";
var idx = 0, fake = null, fakeT = 0, idleTimer = null, usingFake = false;

function render(i){
  var t = TRACKS[i], fade = [$("sentence"), $("work"), $("songinfo")];
  fade.forEach(function(e){ e.classList.remove("show"); });
  setTimeout(function(){
    $("sentence").textContent = t.text;
    $("work").textContent = t.work ? "「" + t.work + "」" : "";
    $("title").textContent = t.title; $("artist").textContent = t.artist;
    fade.forEach(function(e){ e.classList.add("show"); });
  }, 700);
  var lab = $("label");
  lab.style.opacity = 0;
  if (t.cover){
    var im = new Image();
    im.onload = function(){
      if (i !== idx) return;
      lab.style.backgroundImage = 'url("' + t.cover + '")';
      lab.style.opacity = 1;
    };
    im.src = t.cover;
  }
  var btns = document.querySelectorAll("#list li button");
  btns.forEach(function(b,k){ b.classList.toggle("cur", k===i) });
}

function play(i){
  idx = (i + TRACKS.length) % TRACKS.length;
  clearInterval(fake); fake = null; usingFake = false;
  render(idx);
  audio.src = TRACKS[idx].file;
  var p = audio.play();
  if (p && p.catch) p.catch(startFake);
}

/* mp3 파일이 없을 때 미리보기용 타이머 */
function startFake(){
  if (fake) return;
  usingFake = true; fakeT = 0; runFake();
}
function runFake(){
  spin(true);
  fake = setInterval(function(){
    fakeT += .25;
    $("fill").style.width = (fakeT / PREVIEW_SECONDS * 100) + "%";
    if (fakeT >= PREVIEW_SECONDS){ play(idx + 1); }
  }, 250);
}
function togglePlay(){
  if (usingFake){
    if (fake){ clearInterval(fake); fake = null; spin(false); } else { runFake(); }
    return;
  }
  if (audio.paused) audio.play(); else audio.pause();
}

function spin(on){ document.body.classList.toggle("playing", on); }
audio.addEventListener("playing", function(){ spin(true); });
audio.addEventListener("pause", function(){ spin(false); });
audio.addEventListener("error", startFake);
audio.addEventListener("ended", function(){ play(idx + 1); });
audio.addEventListener("timeupdate", function(){
  if (audio.duration) $("fill").style.width = (audio.currentTime / audio.duration * 100) + "%";
});

/* 목록 */
TRACKS.forEach(function(t,i){
  var li = document.createElement("li"), b = document.createElement("button");
  b.type = "button";
  b.innerHTML = '<span class="n">' + (i+1) + '</span><span></span>';
  b.lastChild.textContent = t.title + " — " + t.artist;
  b.onclick = function(){ closeList(); play(i); };
  li.appendChild(b); $("list").appendChild(li);
});
var head = document.createElement("div");
head.id = "listhead";
var homeBtn = document.createElement("button");
homeBtn.type = "button"; homeBtn.textContent = "처음으로"; homeBtn.onclick = function(){ goHome(); };
var closeBtn = document.createElement("button");
closeBtn.type = "button"; closeBtn.textContent = "닫기"; closeBtn.onclick = function(){ closeList(); };
head.appendChild(homeBtn); head.appendChild(closeBtn);
$("list").insertBefore(head, $("list").firstChild);

/* 처음 화면(「실시간의 당신」)으로 돌아가기 */
function goHome(){
  closeList();
  clearInterval(fake); fake = null; usingFake = false;
  audio.pause(); audio.currentTime = 0;
  spin(false);
  $("fill").style.width = "0%";
  $("start").style.display = "";
}

function openList(){ $("list").classList.add("open"); poke(); }
function closeList(){ $("list").classList.remove("open"); clearTimeout(idleTimer); }
function poke(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(closeList, IDLE_SECONDS * 1000);
}
$("list-btn").onclick = openList;
$("prev").onclick = function(){ play(idx - 1); };
$("next").onclick = function(){ play(idx + 1); };
$("pp").onclick = togglePlay;
$("list").addEventListener("touchstart", poke);
$("list").addEventListener("scroll", poke);

/* 시작: 브라우저 정책상 첫 터치가 필요 */
$("start").onclick = function(){
  $("start").style.display = "none";
  try{ if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }catch(e){}
  try{ if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){}); }catch(e){}
  play(0);
};
document.addEventListener("contextmenu", function(e){ e.preventDefault(); });
</script>
</body>
</html>
